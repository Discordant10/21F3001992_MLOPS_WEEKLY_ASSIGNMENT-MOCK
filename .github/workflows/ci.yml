name: IITM MLOps CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication
        run: |
          gcloud auth list

      - name: Pull DVC Data
        run: |
          dvc pull || true

      - name: Run Preprocessing
        run: |
          python scripts/preprocess.py --dataset iris_v0
          python scripts/preprocess.py --dataset iris_v1

      - name: Train Iteration 1
        run: |
          python scripts/train.py --iteration 1

      - name: Train Iteration 2
        run: |
          python scripts/train.py --iteration 2

      - name: Run Unit Tests
        run: |
          pytest

      - name: Upload Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/

      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/

      - name: Upload Predictions
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
