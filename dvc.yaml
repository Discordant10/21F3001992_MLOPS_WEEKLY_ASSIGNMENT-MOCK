train_iteration_1:
  cmd: python scripts/train.py --iteration 1

  deps:
    - scripts/train.py
    - scripts/utils.py
    - params.yaml
    - data/processed/iris_v0_processed.csv

  outs:
    - models/model_iteration_1.pkl

  metrics:
    - metrics/iteration1_metrics.json

train_iteration_2:
  cmd: python scripts/train.py --iteration 2

  deps:
    - scripts/train.py
    - scripts/utils.py
    - params.yaml
    - data/processed/iris_merged.csv

  outs:
    - models/model_iteration_2.pkl

  metrics:
    - metrics/iteration2_metrics.json
